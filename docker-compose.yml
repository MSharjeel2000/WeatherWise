services:
  # MongoDB database
  mongo:
    image: mongo:8.0
    container_name: weatherwise-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

  # Express backend from Docker Hub
  backend:
    image: sharjeel10/weatherwise-backend:latest
    container_name: weatherwise-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/weatherwise
    depends_on:
      mongo:
        condition: service_healthy

  # React frontend from Docker Hub
  frontend:
    image: sharjeel10/weatherwise-frontend:latest
    container_name: weatherwise-frontend
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  mongodb_data: